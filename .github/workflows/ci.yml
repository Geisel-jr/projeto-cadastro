name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  front:
    name: Front-end (testes e build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm install

      - name: Rodar testes
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Gerar build
        run: npm run build

  api:
    name: API (dependências e sintaxe)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Verificar sintaxe
        run: node --check server.js && node --check validacoes.js

  docker:
    name: Docker (sobe tudo e testa)
    runs-on: ubuntu-latest
    needs: [front, api]
    steps:
      - uses: actions/checkout@v4

      - name: Subir containers
        run: docker compose up -d --build --wait

      - name: Testar front e API
        run: |
          set -e
          URL=http://localhost:3000/api
          J='Content-Type: application/json'
          U='X-Usuario: CI'
          EMPRESA='{"nome":"Empresa CI","cnpj":"11222333000181","email":"ci@teste.com","telefone":"11988887777","cep":"01001000"}'

          # status HTTP de uma requisição
          status() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          esperar() { echo "→ $1"; test "$2" = "$3" || { echo "  esperado $3, recebido $2"; exit 1; }; }

          echo "→ Front responde"
          curl -sf http://localhost:3000 > /dev/null
          echo "→ API e banco estão no ar"
          curl -sf $URL/health

          esperar "Alteração sem operador retorna 401" "$(status -X POST $URL/empresas -H "$J" -d "$EMPRESA")" 401
          esperar "Empresa válida retorna 201" "$(status -X POST $URL/empresas -H "$J" -H "$U" -d "$EMPRESA")" 201
          esperar "CNPJ duplicado retorna 409" "$(status -X POST $URL/empresas -H "$J" -H "$U" -d "$EMPRESA")" 409
          esperar "Edição retorna 200" "$(status -X PUT $URL/empresas/1 -H "$J" -H "$U" \
            -d '{"nome":"Empresa CI Editada","cnpj":"11222333000181","email":"ci@teste.com","telefone":"1133334444","cep":"01001000","porte":"ME"}')" 200
          esperar "Exclusão sem motivo retorna 400" "$(status -X DELETE $URL/empresas/1 -H "$J" -H "$U" -d '{}')" 400
          esperar "Exclusão com motivo retorna 200" "$(status -X DELETE $URL/empresas/1 -H "$J" -H "$U" -d '{"motivo":"Teste da CI"}')" 200
          esperar "Registro excluído some dos ativos" "$(curl -s $URL/empresas)" "[]"
          esperar "Registro excluído continua no banco" "$(curl -s "$URL/empresas?status=excluidos" | grep -c 'Teste da CI')" 1
          esperar "Restauração retorna 200" "$(status -X POST $URL/empresas/1/restaurar -H "$U")" 200
          esperar "Auditoria registrou as 4 ações" "$(curl -s $URL/empresas/1/historico | grep -o '"acao"' | wc -l)" 4

          # Documentos (arquivos no MinIO)
          PASTA=$(mktemp -d)
          printf '%%PDF-1.4\n%%teste CI\n' > "$PASTA/cartao.pdf"
          printf 'Cart\303\243o CNPJ' > "$PASTA/tipo.txt"   # "Cartão CNPJ" em UTF-8
          esperar "Anexo sem arquivo retorna 400" "$(status -X POST $URL/empresas/1/documentos -H "$U" -F "tipo=<$PASTA/tipo.txt")" 400
          esperar "Anexo de documento retorna 201" "$(status -X POST $URL/empresas/1/documentos -H "$U" \
            -F "tipo=<$PASTA/tipo.txt" -F "arquivo=@$PASTA/cartao.pdf;type=application/pdf")" 201
          curl -s -o "$PASTA/baixado.pdf" $URL/empresas/1/documentos/1/arquivo
          esperar "Arquivo baixado é igual ao enviado" "$(cmp -s "$PASTA/cartao.pdf" "$PASTA/baixado.pdf" && echo ok)" ok
          esperar "Remoção de anexo retorna 200" "$(status -X DELETE $URL/empresas/1/documentos/1 -H "$J" -H "$U" -d '{"motivo":"Teste da CI"}')" 200
          esperar "Restauração de anexo retorna 200" "$(status -X POST $URL/empresas/1/documentos/1/restaurar -H "$U")" 200
          esperar "Histórico da empresa inclui os anexos" "$(curl -s $URL/empresas/1/historico | grep -o '"acao"' | wc -l)" 7

          esperar "Pessoa inválida retorna 400" "$(status -X POST $URL/pessoas -H "$J" -H "$U" -d '{"nome":"X"}')" 400
          esperar "Pessoa vinculada à empresa retorna 201" "$(status -X POST $URL/pessoas -H "$J" -H "$U" \
            -d '{"nome":"Maria da Silva","cpf":"12345678909","email":"maria@email.com","telefone":"31999990000","dataNascimento":"1995-04-20","profissao":"QA","empresaId":1}')" 201

          echo "✅ Todos os testes passaram"

      - name: Logs dos containers (em caso de falha)
        if: failure()
        run: docker compose logs

      - name: Derrubar containers
        if: always()
        run: docker compose down -v
