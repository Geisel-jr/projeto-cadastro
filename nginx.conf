server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Repassa as chamadas /api para o container da API
  location /api/ {
    # O padrão do nginx é 1 MB. Fica um pouco acima do limite da API (10 MB)
    # para que arquivos grandes recebam a mensagem de erro da própria API.
    client_max_body_size 11m;
    proxy_pass http://api:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    try_files $uri /index.html;
  }
}
