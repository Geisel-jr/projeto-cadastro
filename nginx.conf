server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Cabeçalhos de segurança do front
  # CSP: só carrega scripts/estilos do próprio site e do Google (login e fontes);
  # conexões só com a própria API e os serviços de CEP/CNPJ.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com; connect-src 'self' https://viacep.com.br https://brasilapi.com.br https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Permite que o popup do Google devolva o login para esta janela
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

  # Repassa as chamadas /api para o container da API
  location /api/ {
    # O padrão do nginx é 1 MB. Fica um pouco acima do limite da API (10 MB)
    # para que arquivos grandes recebam a mensagem de erro da própria API.
    client_max_body_size 11m;
    proxy_pass http://api:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    try_files $uri /index.html;
  }
}
