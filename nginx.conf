server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Repassa as chamadas /api para o container da API
  location /api/ {
    proxy_pass http://api:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    try_files $uri /index.html;
  }
}
